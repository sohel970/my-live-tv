<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal IPTV Cloud Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131a26;
            --accent-color: #3b82f6;
            --text-color: #f3f4f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 40px; }
        header {
            background: rgba(19, 26, 38, 0.8); backdrop-filter: blur(10px);
            padding: 15px 20px; display: flex; justify-content: space-between;
            align-items: center; position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .logo { font-size: 22px; font-weight: 700; color: #3b82f6; display: flex; align-items: center; gap: 8px; }
        .player-container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        
        /* আইফ্রেম রেসপনসিভ বক্স */
        .video-wrapper {
            position: relative; padding-top: 56.25%; background: #000;
            border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .now-playing { margin-top: 15px; }
        .now-playing h2 { font-size: 18px; font-weight: 600; color: #3b82f6; }
        .grid-container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .channel-card {
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 14px;
            padding: 20px 10px; text-align: center; cursor: pointer; transition: 0.3s;
        }
        .channel-card:hover { transform: translateY(-5px); border-color: #3b82f6; }
        .channel-name { font-size: 14px; font-weight: 600; }
        @media(max-width: 600px) { .channel-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-cloud"></i> Obiram Engine Clone</div>
    </header>

    <div class="player-container">
        <div class="video-wrapper" id="playerBox">
            <!-- এখানে সরাসরি ওপেন হবে প্রথম চ্যানেল -->
            <iframe id="tvFrame" src="https://tsetv.top/somoy/embed.html" allowfullscreen allow="autoplay"></iframe>
        </div>
        <div class="now-playing">
            <h2 id="currentChannelName">Playing: Somoy TV</h2>
        </div>
    </div>

    <div class="grid-container">
        <div class="channel-grid">
            <!-- অবিরাম টিভির অফিশিয়াল ডাইনামিক ওয়েব এমবেড সোর্স -->
            <div class="channel-card" onclick="changeChannel('Somoy TV', 'https://tsetv.top/somoy/embed.html')">
                <div class="channel-name">Somoy TV</div>
            </div>
            <div class="channel-card" onclick="changeChannel('Jamuna TV', 'https://tsetv.top/jamuna/embed.html')">
                <div class="channel-name">Jamuna TV</div>
            </div>
            <div class="channel-card" onclick="changeChannel('Independent TV', 'https://tsetv.top/independent/embed.html')">
                <div class="channel-name">Independent TV</div>
            </div>
            <div class="channel-card" onclick="changeChannel('Channel 24', 'https://tsetv.top/channel24/embed.html')">
                <div class="channel-name">Channel 24</div>
            </div>
            <div class="channel-card" onclick="changeChannel('71 TV (Ekattor)', 'https://tsetv.top/ekattor/embed.html')">
                <div class="channel-name">71 TV</div>
            </div>
            <div class="channel-card" onclick="changeChannel('ATN Bangla', 'https://tsetv.top/atnbangla/embed.html')">
                <div class="channel-name">ATN Bangla</div>
            </div>
        </div>
    </div>

    <script>
        function changeChannel(name, embedUrl) {
            document.getElementById('currentChannelName').innerText = "Playing: " + name;
            // সরাসরি আইফ্রেমের সোর্স চেঞ্জ হবে, কোনো HLS বা প্লেয়ারের দরকার নেই
            document.getElementById('tvFrame').src = embedUrl;
        }
    </script>
</body>
</html>
