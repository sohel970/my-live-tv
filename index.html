<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sohel IPTV Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg:      #080b10;
            --surface: #0e1420;
            --surf2:   #141c2b;
            --border:  rgba(255,255,255,0.07);
            --accent:  #3d8bff;
            --accent2: #7c5cfc;
            --live:    #ff3a5c;
            --text:    #e8edf5;
            --muted:   #6b7a96;
            --glow:    rgba(61,139,255,0.18);
            --sidebar: 260px;
        }

        * { margin:0; padding:0; box-sizing:border-box;
            font-family:'Inter','Hind Siliguri',sans-serif;
            -webkit-tap-highlight-color:transparent; user-select:none; }

        html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); }

        /* ══════════════════════════════
           APP SHELL  (header + body)
        ══════════════════════════════ */
        .app-shell { display:flex; flex-direction:column; height:100vh; }

        /* ── HEADER ── */
        .app-header {
            flex-shrink:0;
            background:var(--surface);
            border-bottom:1px solid var(--border);
            padding:11px 16px;
            display:flex; align-items:center; gap:12px;
            z-index:200;
        }
        .logo-mark {
            width:34px; height:34px; border-radius:9px; flex-shrink:0;
            background:linear-gradient(135deg,var(--accent),var(--accent2));
            display:flex; align-items:center; justify-content:center;
            font-size:15px; color:#fff;
            box-shadow:0 4px 12px var(--glow);
        }
        .header-titles { flex:0 0 auto; }
        .app-name {
            font-size:14px; font-weight:700; letter-spacing:.3px;
            background:linear-gradient(90deg,#fff 40%,var(--accent));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .app-sub { font-size:9px; color:var(--muted); font-weight:500; margin-top:1px; }

        .header-search {
            flex:1; display:flex; align-items:center; gap:8px;
            background:var(--surf2); border:1px solid var(--border);
            border-radius:10px; padding:7px 12px;
            transition:border-color .2s, box-shadow .2s;
        }
        .header-search:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--glow); }
        .header-search i { color:var(--muted); font-size:12px; flex-shrink:0; }
        .header-search input { background:none; border:none; outline:none; color:var(--text); font-size:13px; font-weight:500; width:100%; }
        .header-search input::placeholder { color:var(--muted); }

        /* mobile sidebar toggle */
        .sidebar-toggle {
            display:none; width:34px; height:34px; border-radius:9px;
            background:var(--surf2); border:1px solid var(--border);
            color:var(--text); font-size:14px; cursor:pointer;
            align-items:center; justify-content:center; flex-shrink:0;
        }

        /* ── BODY (sidebar + main) ── */
        .app-body { flex:1; display:flex; overflow:hidden; }

        /* ══════════════════════════════
           SIDEBAR
        ══════════════════════════════ */
        .sidebar {
            width:var(--sidebar); flex-shrink:0;
            background:var(--surface);
            border-right:1px solid var(--border);
            display:flex; flex-direction:column;
            overflow:hidden;
            transition:transform .3s ease;
        }

        .sidebar-head {
            flex-shrink:0;
            padding:12px 14px 10px;
            border-bottom:1px solid var(--border);
            display:flex; align-items:center; justify-content:space-between;
        }
        .sidebar-title {
            font-size:11px; font-weight:700; letter-spacing:1.2px;
            text-transform:uppercase; color:var(--muted);
            display:flex; align-items:center; gap:6px;
        }
        .sidebar-title i { color:var(--accent); }
        .ch-count {
            font-size:10px; font-weight:600; color:var(--muted);
            background:var(--surf2); border:1px solid var(--border);
            padding:2px 8px; border-radius:20px;
        }

        .channels-list {
            flex:1; overflow-y:auto; padding:8px 8px 16px;
        }
        .channels-list::-webkit-scrollbar { width:3px; }
        .channels-list::-webkit-scrollbar-track { background:transparent; }
        .channels-list::-webkit-scrollbar-thumb { background:var(--surf2); border-radius:2px; }

        /* Channel row */
        .ch-item {
            display:flex; align-items:center; gap:10px;
            padding:8px 10px; border-radius:10px; cursor:pointer;
            transition:background .15s;
            position:relative;
        }
        .ch-item:hover { background:var(--surf2); }
        .ch-item.active {
            background:rgba(61,139,255,0.12);
            border:1px solid rgba(61,139,255,0.25);
        }
        .ch-item.active::before {
            content:''; position:absolute; left:0; top:20%; bottom:20%;
            width:3px; background:var(--accent); border-radius:0 3px 3px 0;
        }
        .ch-logo {
            width:36px; height:36px; flex-shrink:0;
            background:#fff; border-radius:8px;
            display:flex; align-items:center; justify-content:center;
            padding:4px; overflow:hidden;
        }
        .ch-logo img { width:100%; height:100%; object-fit:contain; display:block; }
        .ch-logo i { font-size:16px; color:var(--accent); display:none; }
        .ch-name {
            font-size:12px; font-weight:600; color:var(--text);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
            flex:1; min-width:0;
        }
        .ch-item.active .ch-name { color:var(--accent); }

        /* skeleton rows */
        .skel-row {
            display:flex; align-items:center; gap:10px;
            padding:8px 10px; border-radius:10px;
            animation:shimmer 1.3s ease-in-out infinite alternate;
        }
        .skel-logo { width:36px; height:36px; border-radius:8px; background:var(--surf2); flex-shrink:0; }
        .skel-name { height:10px; border-radius:5px; background:var(--surf2); flex:1; }
        @keyframes shimmer { from{opacity:.4} to{opacity:.9} }

        /* ══════════════════════════════
           MAIN CONTENT AREA
        ══════════════════════════════ */
        .main-area {
            flex:1; overflow:hidden;
            display:flex; flex-direction:column;
            background:var(--bg);
        }

        /* welcome screen (no channel selected) */
        .welcome-screen {
            flex:1; display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            gap:14px; color:var(--muted); text-align:center; padding:30px;
        }
        .welcome-screen .big-icon {
            width:72px; height:72px; border-radius:20px;
            background:var(--surf2); border:1px solid var(--border);
            display:flex; align-items:center; justify-content:center;
            font-size:30px; color:var(--surface);
        }
        .welcome-screen h3 { font-size:16px; font-weight:700; color:var(--text); }
        .welcome-screen p { font-size:12px; line-height:1.6; max-width:260px; }

        /* ══════════════════════════════
           PLAYER
        ══════════════════════════════ */
        .player-wrap {
            flex:1; display:flex; flex-direction:column;
            overflow:hidden;
        }

        .player-container {
            width:100%; position:relative;
            background:#000; overflow:hidden;
        }

        .main-screen {
            width:100%; aspect-ratio:16/9;
            position:relative; background:#000; overflow:hidden;
        }

        .player-container:fullscreen,
        .player-container:-webkit-full-screen {
            width:100vw !important; height:100vh !important; max-width:100vw !important;
        }
        .player-container:fullscreen .main-screen,
        .player-container:-webkit-full-screen .main-screen {
            height:100vh !important; aspect-ratio:auto !important;
        }

        .video-render-box { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
        .video-render-box video { width:100%; height:100%; display:block; }
        .fit-mode video { object-fit:contain !important; }
        .stretch-mode video { object-fit:fill !important; }

        /* Loader */
        .premium-loader-layer {
            position:absolute; inset:0; background:rgba(0,0,0,0.75);
            backdrop-filter:blur(6px); z-index:20;
            display:none; align-items:center; justify-content:center;
            flex-direction:column; gap:12px; pointer-events:none;
        }
        .spinner-ring {
            width:42px; height:42px;
            border:3px solid rgba(61,139,255,0.15);
            border-top-color:var(--accent); border-radius:50%;
            animation:spin .75s linear infinite;
            filter:drop-shadow(0 0 8px var(--accent));
        }
        .loader-text { font-size:10px; font-weight:600; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }
        @keyframes spin { to{transform:rotate(360deg)} }

        /* Controls */
        .player-controls-layer {
            position:absolute; inset:0; z-index:15;
            display:flex; flex-direction:column; justify-content:space-between;
            pointer-events:none; transition:opacity .35s ease;
        }
        .player-controls-layer.hidden { opacity:0; cursor:none; }

        .player-top-bar {
            pointer-events:auto;
            background:linear-gradient(to bottom,rgba(0,0,0,.82) 0%,transparent 100%);
            padding:12px 14px;
            display:flex; align-items:center; gap:8px;
        }
        .back-btn {
            width:32px; height:32px; background:rgba(255,255,255,.1);
            border:1px solid rgba(255,255,255,.1); border-radius:9px;
            color:#fff; font-size:13px; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            flex-shrink:0; backdrop-filter:blur(4px);
        }
        .channel-info { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
        .channel-info img {
            width:30px; height:30px; border-radius:7px;
            background:#fff; object-fit:contain; padding:3px; flex-shrink:0;
        }
        .channel-meta { min-width:0; }
        .channel-title { font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .channel-quality { font-size:9px; font-weight:700; letter-spacing:1px; color:var(--accent); margin-top:1px; }

        .server-pills { display:flex; gap:4px; flex-shrink:0; }
        .srv-btn {
            background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);
            color:rgba(255,255,255,.7); padding:4px 9px;
            border-radius:20px; font-size:10px; font-weight:700; cursor:pointer; transition:all .2s;
        }
        .srv-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 0 10px rgba(61,139,255,.4); }

        .ctrl-actions { display:flex; align-items:center; gap:4px; flex-shrink:0; }
        .ctrl-btn {
            width:30px; height:30px; background:rgba(255,255,255,.08);
            border:1px solid rgba(255,255,255,.1); border-radius:8px;
            color:#fff; font-size:12px; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            backdrop-filter:blur(4px); transition:background .2s;
        }
        .ctrl-btn:active { background:rgba(255,255,255,.2); }

        .player-bottom-bar {
            pointer-events:auto;
            background:linear-gradient(to top,rgba(0,0,0,.82) 0%,transparent 100%);
            padding:12px 14px; display:flex; align-items:center; gap:10px;
        }
        .play-btn {
            width:40px; height:40px; background:var(--accent); border:none;
            border-radius:11px; color:#fff; font-size:15px; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            box-shadow:0 4px 12px rgba(61,139,255,.4); flex-shrink:0;
            transition:transform .15s;
        }
        .play-btn:active { transform:scale(.93); }
        .live-pill {
            display:flex; align-items:center; gap:5px;
            background:var(--live); padding:4px 10px;
            border-radius:20px; font-size:10px; font-weight:800; letter-spacing:1px;
        }
        .live-dot { width:6px; height:6px; background:#fff; border-radius:50%; animation:livepulse 1.2s ease-in-out infinite; }
        @keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:.3} }

        /* Gesture */
        .gesture-detector-box { position:absolute; inset:0; z-index:10; display:flex; }
        .gesture-side { width:50%; height:100%; }
        .gesture-osd {
            position:absolute; top:50%; transform:translateY(-50%) scale(.85);
            background:rgba(8,11,16,.88); backdrop-filter:blur(12px);
            border:1px solid rgba(255,255,255,.1); color:#fff;
            width:44px; height:150px; border-radius:22px;
            display:flex; flex-direction:column; align-items:center; justify-content:space-between;
            padding:10px 0; z-index:25; pointer-events:none;
            opacity:0; transition:opacity .25s,transform .25s;
        }
        .gesture-osd.active { opacity:1; transform:translateY(-50%) scale(1); }
        .osd-track { width:4px; height:85px; background:rgba(255,255,255,.1); border-radius:2px; position:relative; overflow:hidden; }
        .osd-fill { position:absolute; bottom:0; left:0; width:100%; height:50%; border-radius:2px; }
        #brightnessOSD .osd-fill { background:linear-gradient(to top,#ff9100,#ffe600); }
        #volumeOSD .osd-fill { background:linear-gradient(to top,var(--accent),#a5d0ff); }
        .gesture-osd i { font-size:12px; color:var(--muted); }
        .osd-val-text { font-size:9px; font-weight:700; color:var(--muted); }
        #brightnessOSD { left:16px; }
        #volumeOSD { right:16px; }

        /* Settings dropdown */
        .settings-overlay {
            position:absolute; top:52px; right:12px; width:220px;
            background:rgba(8,11,16,.97); backdrop-filter:blur(20px);
            border:1px solid var(--border); border-radius:13px;
            padding:5px 0; box-shadow:0 14px 36px rgba(0,0,0,.7);
            z-index:40; display:none;
        }
        .menu-section-label { font-size:9px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); padding:8px 13px 4px; }
        .menu-item { display:flex; justify-content:space-between; align-items:center; padding:9px 13px; cursor:pointer; font-size:12px; border-bottom:1px solid var(--border); transition:background .15s; }
        .menu-item:last-child { border-bottom:none; }
        .menu-item:active { background:rgba(255,255,255,.04); }
        .menu-left { display:flex; align-items:center; gap:9px; }
        .menu-left i { width:15px; text-align:center; color:var(--accent); font-size:12px; }
        .menu-right { color:var(--muted); display:flex; align-items:center; gap:4px; font-size:11px; }
        .quality-select-inline { background:transparent; color:var(--text); border:none; outline:none; font-size:11px; font-weight:600; cursor:pointer; }
        .quality-select-inline option { background:#0e1420; }

        .brightness-overlay { position:absolute; inset:0; background:rgba(0,0,0,0); pointer-events:none; z-index:5; }

        /* ══════════════════════════════
           MOBILE overlay sidebar
        ══════════════════════════════ */
        .sidebar-backdrop {
            display:none; position:fixed; inset:0; z-index:300;
            background:rgba(0,0,0,.6); backdrop-filter:blur(4px);
        }

        @media (max-width: 680px) {
            :root { --sidebar: 240px; }
            .sidebar-toggle { display:flex; }
            .sidebar {
                position:fixed; left:0; top:0; height:100vh;
                z-index:400; transform:translateX(-100%);
                box-shadow:6px 0 30px rgba(0,0,0,.6);
            }
            .sidebar.open { transform:translateX(0); }
            .sidebar-backdrop.open { display:block; }
            .welcome-screen { display:none; }
        }
    </style>
</head>
<body>

<div class="app-shell">

    <!-- HEADER -->
    <header class="app-header">
        <div class="logo-mark"><i class="fa-solid fa-tv"></i></div>
        <div class="header-titles">
            <div class="app-name">Sohel IPTV Pro</div>
            <div class="app-sub">Live Streaming</div>
        </div>
        <div class="header-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchChan" placeholder="চ্যানেল খুঁজুন...">
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </button>
    </header>

    <!-- BODY -->
    <div class="app-body">

        <!-- SIDEBAR BACKDROP (mobile) -->
        <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-head">
                <div class="sidebar-title"><i class="fa-solid fa-signal"></i> সব চ্যানেল</div>
                <span class="ch-count" id="channelCount">...</span>
            </div>
            <div class="channels-list" id="uiChannelsGrid">
                <div class="skel-row"><div class="skel-logo"></div><div class="skel-name"></div></div>
                <div class="skel-row"><div class="skel-logo"></div><div class="skel-name"></div></div>
                <div class="skel-row"><div class="skel-logo"></div><div class="skel-name"></div></div>
                <div class="skel-row"><div class="skel-logo"></div><div class="skel-name"></div></div>
                <div class="skel-row"><div class="skel-logo"></div><div class="skel-name"></div></div>
                <div class="skel-row"><div class="skel-logo"></div><div class="skel-name"></div></div>
                <div class="skel-row"><div class="skel-logo"></div><div class="skel-name"></div></div>
                <div class="skel-row"><div class="skel-logo"></div><div class="skel-name"></div></div>
            </div>
        </aside>

        <!-- MAIN AREA -->
        <main class="main-area" id="mainArea">

            <!-- Welcome screen -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="big-icon"><i class="fa-solid fa-tv" style="color:var(--muted)"></i></div>
                <h3>চ্যানেল বেছে নিন</h3>
                <p>বাম পাশ থেকে যেকোনো চ্যানেলে ক্লিক করুন দেখা শুরু করতে</p>
            </div>

            <!-- Player -->
            <div class="player-wrap" id="playerWrap" style="display:none;">
                <div class="player-container" id="playerContainer">
                    <div class="main-screen" id="mainScreenBox">
                        <div class="brightness-overlay" id="brightLayer"></div>

                        <div class="premium-loader-layer" id="streamLoader">
                            <div class="spinner-ring"></div>
                            <div class="loader-text">লোড হচ্ছে...</div>
                        </div>

                        <div class="gesture-detector-box" id="gestureBox">
                            <div class="gesture-side" id="leftSideBright"></div>
                            <div class="gesture-side" id="rightSideVol"></div>
                        </div>

                        <div class="gesture-osd" id="brightnessOSD">
                            <span class="osd-val-text" id="brightText">100%</span>
                            <div class="osd-track"><div class="osd-fill" id="brightFill"></div></div>
                            <i class="fa-solid fa-sun"></i>
                        </div>
                        <div class="gesture-osd" id="volumeOSD">
                            <span class="osd-val-text" id="volText">100%</span>
                            <div class="osd-track"><div class="osd-fill" id="volFill"></div></div>
                            <i class="fa-solid fa-volume-high"></i>
                        </div>

                        <div class="video-render-box fit-mode" id="videoWrapper">
                            <video id="mainVideoPlayer" playsinline></video>
                        </div>

                        <div class="player-controls-layer" id="controlsLayer">
                            <div class="player-top-bar">
                                <div class="channel-info">
                                    <img id="playerLogo" src="" alt="">
                                    <div class="channel-meta">
                                        <div class="channel-title" id="playerTitle">Loading...</div>
                                        <div class="channel-quality">HD LIVE</div>
                                    </div>
                                </div>
                                <div class="server-pills">
                                    <button class="srv-btn active" onclick="switchServer(1)">S1</button>
                                    <button class="srv-btn" onclick="switchServer(2)">S2</button>
                                    <button class="srv-btn" onclick="switchServer(3)">S3</button>
                                </div>
                                <div class="ctrl-actions">
                                    <button class="ctrl-btn" onclick="refreshStream()"><i class="fa-solid fa-rotate"></i></button>
                                    <button class="ctrl-btn" onclick="toggleSettingsOverlay()"><i class="fa-solid fa-sliders"></i></button>
                                    <button class="ctrl-btn" onclick="toggleFullscreen()"><i class="fa-solid fa-expand"></i></button>
                                </div>
                            </div>
                            <div class="player-bottom-bar">
                                <button class="play-btn" id="customPlayBtn" onclick="togglePlayPause()">
                                    <i class="fa-solid fa-pause"></i>
                                </button>
                                <div class="live-pill"><div class="live-dot"></div>LIVE</div>
                            </div>
                        </div>

                        <div class="settings-overlay" id="settingsMenu">
                            <div class="menu-section-label">প্লেব্যাক</div>
                            <div class="menu-item">
                                <div class="menu-left"><i class="fa-solid fa-sliders"></i><span>Quality</span></div>
                                <div class="menu-right">
                                    <select id="hlsQualitySelect" class="quality-select-inline" onchange="changeResolution(this.value)">
                                        <option value="-1">Auto</option>
                                    </select>
                                    <i class="fa-solid fa-chevron-right" style="font-size:9px;"></i>
                                </div>
                            </div>
                            <div class="menu-item" onclick="changeAspectRatio()">
                                <div class="menu-left"><i class="fa-solid fa-expand-alt"></i><span>Aspect Ratio</span></div>
                                <div class="menu-right"><span id="ratioLabel">Fit</span></div>
                            </div>
                            <div class="menu-item" onclick="activatePiP()">
                                <div class="menu-left"><i class="fa-solid fa-window-restore"></i><span>Picture in Picture</span></div>
                                <div class="menu-right"><i class="fa-solid fa-arrow-up-right-from-square" style="font-size:9px;"></i></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
    const playlistM3uUrl = "https://raw.githubusercontent.com/sohel970/my-live-tv/refs/heads/main/Skym3u-176.m3u";

    let parsedChannels = [];
    let activeSelectedChannel = null;
    let hlsInstance = null;
    const videoElement = document.getElementById('mainVideoPlayer');
    const loaderLayer  = document.getElementById('streamLoader');
    let controlsTimer  = null;
    let isPanelActive  = true;
    let startY=0, startVol=1, startBright=100, currentBrightness=100;

    document.addEventListener('DOMContentLoaded', () => {
        fetchPlaylist();
        setupGestureListeners();
        setupPanelAutoHideTrigger();
        videoElement.addEventListener('playing', () => { loaderLayer.style.display='none'; });
        videoElement.addEventListener('waiting', () => { loaderLayer.style.display='flex'; });
    });

    /* ── Sidebar toggle (mobile) ── */
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebarBackdrop').classList.toggle('open');
    }

    /* ── Player controls panel ── */
    function setupPanelAutoHideTrigger() {
        document.getElementById('gestureBox').addEventListener('click', () => {
            if (!isPanelActive) showControlPanel(); else hideControlPanel();
        });
        document.getElementById('playerContainer').addEventListener('touchstart', resetAutoHideTimer);
        document.getElementById('playerContainer').addEventListener('mousemove',  resetAutoHideTimer);
        showControlPanel();
    }
    function showControlPanel() {
        document.getElementById('controlsLayer').classList.remove('hidden');
        isPanelActive = true; resetAutoHideTimer();
    }
    function hideControlPanel() {
        document.getElementById('controlsLayer').classList.add('hidden');
        document.getElementById('settingsMenu').style.display='none';
        isPanelActive = false;
    }
    function resetAutoHideTimer() {
        clearTimeout(controlsTimer);
        if (isPanelActive) controlsTimer = setTimeout(() => hideControlPanel(), 7000);
    }

    /* ── Gestures ── */
    function setupGestureListeners() {
        const left  = document.getElementById('leftSideBright');
        const right = document.getElementById('rightSideVol');
        const bOSD  = document.getElementById('brightnessOSD');
        const vOSD  = document.getElementById('volumeOSD');

        left.addEventListener('touchstart',  e => { startY=e.touches[0].clientY; startBright=currentBrightness; bOSD.classList.add('active'); });
        left.addEventListener('touchmove',   e => {
            e.preventDefault();
            let nb = Math.min(100,Math.max(10, startBright + Math.round(((startY-e.touches[0].clientY)/window.innerHeight)*220)));
            currentBrightness = nb;
            document.getElementById('brightLayer').style.background = `rgba(0,0,0,${((100-nb)/100)*.95})`;
            document.getElementById('brightText').innerText  = nb+'%';
            document.getElementById('brightFill').style.height = nb+'%';
            resetAutoHideTimer();
        });
        left.addEventListener('touchend', () => setTimeout(()=>bOSD.classList.remove('active'),500));

        right.addEventListener('touchstart', e => { startY=e.touches[0].clientY; startVol=videoElement.volume; vOSD.classList.add('active'); });
        right.addEventListener('touchmove',  e => {
            e.preventDefault();
            let nv = Math.min(1,Math.max(0, startVol+((startY-e.touches[0].clientY)/window.innerHeight*1.8)));
            videoElement.volume = nv;
            let vp = Math.round(nv*100);
            document.querySelector('#volumeOSD i').className = vp===0 ? "fa-solid fa-volume-xmark" : vp<50 ? "fa-solid fa-volume-low" : "fa-solid fa-volume-high";
            document.getElementById('volText').innerText   = vp+'%';
            document.getElementById('volFill').style.height = vp+'%';
            resetAutoHideTimer();
        });
        right.addEventListener('touchend', () => setTimeout(()=>vOSD.classList.remove('active'),500));
    }

    /* ── Playlist ── */
    async function fetchPlaylist() {
        try {
            const res  = await fetch(playlistM3uUrl);
            const text = await res.text();
            parseM3u(text);
        } catch(e) {
            console.error("ফাইল লোড করতে সমস্যা:", e);
            parsedChannels = [
                {name:"BTV National",  logo:"", url:"#"},
                {name:"Channel i",     logo:"", url:"#"},
                {name:"NTV Bangladesh",logo:"", url:"#"},
                {name:"ATN Bangla",    logo:"", url:"#"},
                {name:"Somoy TV",      logo:"", url:"#"},
                {name:"Jamuna TV",     logo:"", url:"#"},
                {name:"Ekattor TV",    logo:"", url:"#"},
                {name:"RTV",           logo:"", url:"#"},
                {name:"Desh TV",       logo:"", url:"#"},
                {name:"Maasranga TV",  logo:"", url:"#"},
                {name:"GTV",           logo:"", url:"#"},
                {name:"Banglavision",  logo:"", url:"#"},
            ];
            renderList(parsedChannels);
        }
    }

    function parseM3u(text) {
        const lines = text.split('\n');
        let cur = {};
        parsedChannels = [];
        for (let line of lines) {
            line = line.trim();
            if (!line) continue;
            if (line.startsWith("#EXTINF:")) {
                cur = {};
                let nm = line.match(/,\s*(.+)$/);
                if (nm) {
                    let raw = nm[1].trim().replace(/\r/g,'');
                    cur.name = raw;
                    let lid = raw.toLowerCase().replace(/\s+/g,'').replace(/hd|sd|tv|bd|sports|movies|bangla/g,'');
                    cur.autoLogo = `https://iptv-org.github.io/logos/channels/${lid}.png`;
                }
                let lm = line.match(/tvg-logo="([^"]+)"/);
                if (lm) cur.logo = lm[1];
            } else if (line.startsWith("http")) {
                if (!cur.name) continue;
                cur.url = line.replace(/\r/g,'');
                parsedChannels.push(cur);
                cur = {};
            }
        }
        renderList(parsedChannels);
    }

    function renderList(list) {
        const grid    = document.getElementById('uiChannelsGrid');
        const countEl = document.getElementById('channelCount');
        grid.innerHTML = "";
        countEl.textContent = list.length;

        if (list.length === 0) {
            grid.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:12px;">কোনো চ্যানেল নেই</div>`;
            return;
        }

        list.forEach((chan, idx) => {
            const item = document.createElement('div');
            item.className = 'ch-item';
            item.dataset.idx = idx;
            let logoUrl = chan.logo || chan.autoLogo || '';
            item.innerHTML = `
                <div class="ch-logo">
                    ${logoUrl ? `<img src="${logoUrl}" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
                    <i class="fa-solid fa-tv"></i>` : `<i class="fa-solid fa-tv" style="display:block;"></i>`}
                </div>
                <span class="ch-name">${chan.name}</span>
            `;
            item.onclick = () => launchPlayer(chan, item);
            grid.appendChild(item);
        });
    }

    function launchPlayer(channel, itemEl) {
        activeSelectedChannel = channel;

        /* highlight active row */
        document.querySelectorAll('.ch-item').forEach(el => el.classList.remove('active'));
        if (itemEl) itemEl.classList.add('active');

        /* close sidebar on mobile after picking */
        if (window.innerWidth <= 680) toggleSidebar();

        /* show player, hide welcome */
        document.getElementById('welcomeScreen').style.display = 'none';
        document.getElementById('playerWrap').style.display    = 'flex';

        loaderLayer.style.display = 'flex';
        document.getElementById('playerTitle').innerText = channel.name;

        const pLogo = document.getElementById('playerLogo');
        let logoUrl = channel.logo || channel.autoLogo || '';
        if (logoUrl) { pLogo.src = logoUrl; pLogo.style.display='block'; pLogo.onerror = ()=>{ pLogo.style.display='none'; }; }
        else pLogo.style.display = 'none';

        loadStreamSource(channel.url);
        showControlPanel();
    }

    function loadStreamSource(url) {
        const qualSelect = document.getElementById('hlsQualitySelect');
        if (hlsInstance) hlsInstance.destroy();
        if (Hls.isSupported()) {
            hlsInstance = new Hls({ maxBufferLength:30 });
            hlsInstance.loadSource(url);
            hlsInstance.attachMedia(videoElement);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                if (hlsInstance.levels.length > 1) {
                    qualSelect.innerHTML = '<option value="-1">Auto</option>';
                    hlsInstance.levels.forEach((lvl, idx) => {
                        if (lvl.height) {
                            let o = document.createElement('option');
                            o.value = idx; o.textContent = lvl.height+'p';
                            qualSelect.appendChild(o);
                        }
                    });
                }
                videoElement.play().catch(()=>{});
                updatePlayBtn(true);
            });
            hlsInstance.on(Hls.Events.ERROR, (ev, data) => { if (data.fatal) loaderLayer.style.display='flex'; });
        } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
            videoElement.src = url;
            videoElement.addEventListener('loadedmetadata', () => { videoElement.play(); updatePlayBtn(true); });
        }
    }

    function togglePlayPause() {
        if (videoElement.paused) { videoElement.play(); updatePlayBtn(true); }
        else { videoElement.pause(); updatePlayBtn(false); }
        resetAutoHideTimer();
    }
    function updatePlayBtn(p) { document.querySelector('#customPlayBtn i').className = p ? "fa-solid fa-pause" : "fa-solid fa-play"; }

    function toggleSettingsOverlay() {
        const m = document.getElementById('settingsMenu');
        m.style.display = (m.style.display==='block') ? 'none' : 'block';
        resetAutoHideTimer();
    }
    function changeResolution(val) {
        if (!hlsInstance) return;
        let i = parseInt(val);
        if (i===-1) hlsInstance.currentLevel=-1;
        else if (hlsInstance.levels.length>i) hlsInstance.currentLevel=i;
        toggleSettingsOverlay();
    }
    function changeAspectRatio() {
        const w = document.getElementById('videoWrapper');
        const l = document.getElementById('ratioLabel');
        if (w.classList.contains('fit-mode')) { w.classList.replace('fit-mode','stretch-mode'); l.innerText='Stretch'; }
        else { w.classList.replace('stretch-mode','fit-mode'); l.innerText='Fit'; }
        toggleSettingsOverlay();
    }
    async function activatePiP() {
        try {
            if (document.pictureInPictureElement) await document.exitPictureInPicture();
            else await videoElement.requestPictureInPicture();
        } catch(e) {}
        toggleSettingsOverlay();
    }
    async function toggleFullscreen() {
        const c = document.getElementById('playerContainer');
        try {
            if (!document.fullscreenElement) {
                if (c.requestFullscreen) await c.requestFullscreen();
                else if (c.webkitRequestFullscreen) await c.webkitRequestFullscreen();
                if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape').catch(()=>{});
            } else {
                if (document.exitFullscreen) await document.exitFullscreen();
                if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
            }
        } catch(err) {}
        resetAutoHideTimer();
    }
    function switchServer(n) {
        if (!activeSelectedChannel) return;
        loaderLayer.style.display='flex';
        document.querySelectorAll('.srv-btn').forEach((b,i) => b.classList.toggle('active', i===n-1));
        let u = activeSelectedChannel.url;
        loadStreamSource(u + (u.includes('?')?'&':'?') + "server="+n+"&ts="+Date.now());
        resetAutoHideTimer();
    }
    function refreshStream() {
        if (activeSelectedChannel) { loaderLayer.style.display='flex'; loadStreamSource(activeSelectedChannel.url); }
        resetAutoHideTimer();
    }

    document.getElementById('searchChan').addEventListener('input', e => {
        let t = e.target.value.toLowerCase();
        renderList(parsedChannels.filter(c => c.name.toLowerCase().includes(t)));
    });
</script>
</body>
</html>
