<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sohel IPTV Pro</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: rgba(20, 30, 54, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-magenta: #ff2a74;
            --text-light: #f1f5f9;
            --overlay-bg: rgba(9, 13, 22, 0.96);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at top, #16223f 0%, var(--bg-dark) 70%);
            color: var(--text-light);
            overflow-x: hidden;
            padding-bottom: 40px;
            min-height: 100vh;
        }

        /* -----------------------------------------
           PREMIUM VIDEO PLAYER CONTAINER
        -------------------------------------------- */
        .player-container {
            max-width: 1000px;
            margin: 15px auto;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 42, 116, 0.15);
            position: relative;
            display: none; 
            width: 95%;
            border: 1px solid rgba(255, 42, 116, 0.2);
        }

        .player-container:fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            margin: 0 !important;
            border-radius: 0 !important;
            border: none;
        }

        .main-screen {
            display: flex;
            width: 100%;
            aspect-ratio: 16 / 9;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .player-container:fullscreen .main-screen {
            height: 100vh !important;
            aspect-ratio: auto !important;
        }

        .video-render-box {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-render-box video {
            width: 100%;
            height: 100%;
            display: block;
        }

        .fit-mode video { object-fit: contain !important; }
        .stretch-mode video { object-fit: fill !important; width: 100vw !important; height: 100vh !important; }

        /* অটো হাইд কন্ট্রোল লেয়ার */
        .player-controls-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 15;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
        }

        .player-controls-layer.hidden {
            opacity: 0;
            cursor: none;
        }

        .player-top-bar, .player-bottom-bar {
            pointer-events: auto;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
            padding: 15px 20px;
        }
        
        .player-bottom-bar {
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .player-top-bar {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr;
            align-items: center;
        }

        .top-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .back-btn { background: transparent; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        .channel-logo-area { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .channel-logo-area img { width: 34px; height: 34px; border-radius: 50%; background: #fff; object-fit: contain; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .channel-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        .server-container { display: flex; gap: 6px; justify-content: center; }
        .srv-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; cursor: pointer; backdrop-filter: blur(5px); transition: all 0.2s; }
        .srv-btn.active { background: var(--accent-magenta); border-color: var(--accent-magenta); box-shadow: 0 0 12px rgba(255, 42, 116, 0.4); }

        .top-right { display: flex; align-items: center; gap: 16px; font-size: 18px; justify-content: flex-end; }
        .top-right i { cursor: pointer; text-shadow: 0 2px 4px rgba(0,0,0,0.8); padding: 4px; transition: transform 0.2s; }
        .top-right i:active { transform: scale(0.85); }

        .play-btn { background: transparent; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        .progress-container { flex: 1; display: flex; align-items: center; }
        .live-badge { background: #ff0000; color: #fff; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; letter-spacing: 1px; box-shadow: 0 0 10px rgba(255,0,0,0.5); animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* জেস্টার টাচ ডিটেক্টর এরিয়া */
        .gesture-detector-box {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            display: flex;
        }
        .gesture-side { width: 50%; height: 100%; }

        /* 🚀 ৩ নম্বর ফিক্স: প্রিমিয়াম ওএসডি জেস্টার লেআউট এবং অ্যানিমেশন */
        .gesture-osd {
            position: absolute;
            top: 50%;
            transform: translateY(-50%) scale(0.8);
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            width: 50px;
            height: 180px;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            z-index: 25;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .gesture-osd.active {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }
        
        /* লিকুইড ভার্টিক্যাল ফিল বার */
        .osd-track {
            width: 6px;
            height: 100px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }
        .osd-fill {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            height: 50%;
            border-radius: 3px;
            transition: height 0.1s linear;
        }
        #brightnessOSD .osd-fill { background: linear-gradient(to top, #ff9100, #ffea00); }
        #volumeOSD .osd-fill { background: linear-gradient(to top, #0072ff, #00c6ff); }

        .gesture-osd i { font-size: 16px; }
        .osd-val-text { font-size: 10px; font-weight: 700; font-family: 'Poppins'; }

        #brightnessOSD { left: 25px; }
        #volumeOSD { right: 25px; }

        /* Settings Overlays */
        .settings-overlay {
            position: absolute;
            top: 55px; right: 20px;
            width: 240px;
            background: var(--overlay-bg);
            backdrop-filter: blur(15px);
            border-radius: 14px;
            padding: 6px 0;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.12);
            z-index: 40;
            display: none; 
            animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; cursor: pointer; font-size: 13.5px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .menu-item:last-child { border-bottom: none; }
        .menu-left { display: flex; align-items: center; gap: 12px; color: #e2e8f0; }
        .menu-left i { width: 16px; text-align: center; color: var(--accent-magenta); }
        .menu-right { color: #94a3b8; display: flex; align-items: center; gap: 6px; }
        .quality-select-inline { background: transparent; color: #fff; border: none; outline: none; font-size: 12px; font-weight: 600; cursor: pointer; }
        .quality-select-inline option { background: #111827; }

        /* -----------------------------------------
           🚀 ২ নম্বর ফিক্স: প্রিমিয়াম হোম পেজ এবং ২-কলাম গ্রিড লেআউট
        -------------------------------------------- */
        .landing-header {
            background: rgba(13, 22, 41, 0.7);
            backdrop-filter: blur(10px);
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-bottom: 1px solid rgba(255, 42, 116, 0.2);
            text-align: center;
        }

        .landing-header h2 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(45deg, #fff, #ff2a74);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 12px rgba(255, 42, 116, 0.1);
        }

        .search-box {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            position: relative;
        }

        .search-box input {
            background: rgba(9, 14, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 30px;
            color: white;
            outline: none;
            width: 100%;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .search-box input:focus {
            border-color: var(--accent-magenta);
            box-shadow: 0 0 15px rgba(255, 42, 116, 0.3), inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .grid-section {
            padding: 25px 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background: var(--accent-magenta);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--accent-magenta);
        }

        /* প্রিমিয়াম কাস্টম রেস্পন্সিভ ২-কলাম কার্ড গ্রিড */
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 🚀 মোবাইলে ডিফল্ট ২টি করে কলাম থাকবে */
            gap: 16px;
        }

        /* ট্যাবলেট এবং ডেক্সটপের জন্য বড় লেআউট অটো অ্যাডজাস্ট */
        @media (min-width: 600px) { .channels-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 900px) { .channels-grid { grid-template-columns: repeat(5, 1fr); } }

        /* গ্লাস-মরফিজম প্রিমিয়াম কার্ড ডিজাইন */
        .channel-card {
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .channel-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255, 42, 116, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .channel-card:active {
            transform: scale(0.95);
            background: rgba(255, 42, 116, 0.05);
            border-color: rgba(255, 42, 116, 0.3);
        }

        .channel-card:hover::before { opacity: 1; }
        .channel-card:hover {
            border-color: rgba(255, 42, 116, 0.4);
            box-shadow: 0 8px 25px rgba(255, 42, 116, 0.15);
            transform: translateY(-4px);
        }

        .logo-wrap {
            width: 65px;
            height: 65px;
            background: #fff;
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        
        .channel-card:hover .logo-wrap { transform: scale(1.08); }

        .logo-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-name {
            font-size: 13px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #e2e8f0;
            letter-spacing: 0.3px;
        }

        .brightness-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0);
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- Premium OTT Top Nav Header -->
    <div class="landing-header">
        <h2>Sohel IPTV Pro</h2>
        <div class="search-box">
            <input type="text" id="searchChan" placeholder="চ্যানেল খুঁজুন...">
        </div>
    </div>

    <!-- Core Video Engine Window -->
    <div class="player-container" id="playerContainer">
        
        <div class="main-screen" id="mainScreenBox">
            <div class="brightness-overlay" id="brightLayer"></div>

            <!-- জেস্টার এরিয়া ট্র্যাকার -->
            <div class="gesture-detector-box" id="gestureBox">
                <div class="gesture-side" id="leftSideBright"></div>
                <div class="gesture-side" id="rightSideVol"></div>
            </div>

            <!-- 🚀 ৩ নম্বর ফিক্স: প্রিমিয়াম ডিজাইন ওএসডি প্যানেল -->
            <div class="gesture-osd" id="brightnessOSD">
                <span class="osd-val-text" id="brightText">100%</span>
                <div class="osd-track"><div class="osd-fill" id="brightFill"></div></div>
                <i class="fa-solid fa-sun"></i>
            </div>
            
            <div class="gesture-osd" id="volumeOSD">
                <span class="osd-val-text" id="volText">100%</span>
                <div class="osd-track"><div class="osd-fill" id="volFill"></div></div>
                <i class="fa-solid fa-volume-high"></i>
            </div>

            <div class="video-render-box fit-mode" id="videoWrapper">
                <video id="mainVideoPlayer" playsinline></video>
            </div>

            <!-- ওয়ান-টাচ অটো হাইড কন্ট্রোল প্যানেল -->
            <div class="player-controls-layer" id="controlsLayer">
                <div class="player-top-bar">
                    <div class="top-left">
                        <button class="back-btn" onclick="closePlayer()"><i class="fa-solid fa-chevron-left"></i></button>
                        <div class="channel-logo-area">
                            <img id="playerLogo" src="" alt="">
                            <span class="channel-title" id="playerTitle">Loading...</span>
                        </div>
                    </div>
                    <div class="server-container">
                        <button class="srv-btn active" onclick="switchServer(1)">Server 1</button>
                        <button class="srv-btn" onclick="switchServer(2)">Server 2</button>
                        <button class="srv-btn" onclick="switchServer(3)">Server 3</button>
                    </div>
                    <div class="top-right">
                        <i class="fa-solid fa-rotate" onclick="refreshStream()"></i>
                        <i class="fa-solid fa-gear" onclick="toggleSettingsOverlay()"></i>
                        <i class="fa-solid fa-expand" onclick="toggleFullscreen()"></i>
                    </div>
                </div>

                <div class="player-bottom-bar">
                    <button class="play-btn" id="customPlayBtn" onclick="togglePlayPause()"><i class="fa-solid fa-pause"></i></button>
                    <div class="progress-container">
                        <span class="live-badge">● LIVE</span>
                    </div>
                </div>
            </div>

            <!-- সেটিংস গিয়ার ওভারলে -->
            <div class="settings-overlay" id="settingsMenu">
                <div class="menu-item">
                    <div class="menu-left"><i class="fa-solid fa-sliders"></i><span>Quality</span></div>
                    <div class="menu-right">
                        <select id="hlsQualitySelect" class="quality-select-inline" onchange="changeResolution(this.value)">
                            <option value="-1">Auto (ডিফল্ট)</option>
                            <option value="1080">1080p (HD)</option>
                            <option value="1440">1440p (2K)</option>
                            <option value="2160">2160p (4K)</option>
                        </select>
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                </div>
                <div class="menu-item" onclick="changeAspectRatio()">
                    <div class="menu-left"><i class="fa-solid fa-vector-square"></i><span>Aspect Ratio</span></div>
                    <div class="menu-right"><span id="ratioLabel">Fit</span></div>
                </div>
                <div class="menu-item" onclick="activatePiP()">
                    <div class="menu-left"><i class="fa-solid fa-window-restore"></i><span>PiP</span></div>
                    <div class="menu-right"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- 🚀 হোম পেজ কার্ড ভিউ সেকশন -->
    <div class="grid-section" id="listSection">
        <h3 class="section-title">সব চ্যানেলসমূহ</h3>
        <div class="channels-grid" id="uiChannelsGrid"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        const playlistM3uUrl = "https://raw.githubusercontent.com/imShakil/tvlink/refs/heads/main/iptv.m3u8";
        let parsedChannels = [];
        let activeSelectedChannel = null;
        let hlsInstance = null;
        const videoElement = document.getElementById('mainVideoPlayer');

        let controlsTimer = null;
        let isPanelActive = true;

        let startY = 0;
        let startVol = 1;
        let startBright = 100;
        let currentBrightness = 100;

        document.addEventListener('DOMContentLoaded', () => {
            fetchPlaylist();
            setupGestureListeners();
            setupPanelAutoHideTrigger();
        });

        function setupPanelAutoHideTrigger() {
            document.getElementById('gestureBox').addEventListener('click', () => {
                if (!isPanelActive) showControlPanel();
                else hideControlPanel();
            });
            document.getElementById('playerContainer').addEventListener('touchstart', resetAutoHideTimer);
            document.getElementById('playerContainer').addEventListener('mousemove', resetAutoHideTimer);
            showControlPanel();
        }

        function showControlPanel() {
            document.getElementById('controlsLayer').classList.remove('hidden');
            isPanelActive = true;
            resetAutoHideTimer();
        }

        function hideControlPanel() {
            document.getElementById('controlsLayer').classList.add('hidden');
            document.getElementById('settingsMenu').style.display = 'none';
            isPanelActive = false;
        }

        function resetAutoHideTimer() {
            clearTimeout(controlsTimer);
            if (isPanelActive) {
                controlsTimer = setTimeout(() => { hideControlPanel(); }, 10000); // ১০ সেকেন্ড পর হাইড
            }
        }

        // 🚀 ৩ নম্বর ফিক্স: অ্যানিমেশন সহ প্রিমিয়াম জেস্টার ইঞ্জিন লজিক
        function setupGestureListeners() {
            const leftSide = document.getElementById('leftSideBright');
            const rightSide = document.getElementById('rightSideVol');
            
            const bOSD = document.getElementById('brightnessOSD');
            const vOSD = document.getElementById('volumeOSD');

            // বাম সাইড (ব্রাইটনেস)
            leftSide.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                startBright = currentBrightness;
                bOSD.classList.add('active');
            });

            leftSide.addEventListener('touchmove', (e) => {
                e.preventDefault();
                let deltaY = startY - e.touches[0].clientY;
                let change = Math.round((deltaY / window.innerHeight) * 220);
                let newBright = Math.min(100, Math.max(10, startBright + change));
                
                currentBrightness = newBright;
                let alpha = (100 - newBright) / 100;
                document.getElementById('brightLayer').style.background = `rgba(0, 0, 0, ${alpha * 0.85})`; 
                
                document.getElementById('brightText').innerText = newBright + '%';
                document.getElementById('brightFill').style.height = newBright + '%';
                resetAutoHideTimer();
            });

            leftSide.addEventListener('touchend', () => {
                setTimeout(() => bOSD.classList.remove('active'), 600);
            });

            // ডান সাইড (ভলিউম)
            rightSide.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                startVol = videoElement.volume;
                vOSD.classList.add('active');
            });

            rightSide.addEventListener('touchmove', (e) => {
                e.preventDefault();
                let deltaY = startY - e.touches[0].clientY;
                let change = deltaY / window.innerHeight * 1.8;
                let newVol = Math.min(1, Math.max(0, startVol + change));
                
                videoElement.volume = newVol;
                let volPercent = Math.round(newVol * 100);
                
                const volIcon = document.querySelector('#volumeOSD i');
                if(volPercent === 0) volIcon.className = "fa-solid fa-volume-xmark";
                else if(volPercent < 50) volIcon.className = "fa-solid fa-volume-low";
                else volIcon.className = "fa-solid fa-volume-high";

                document.getElementById('volText').innerText = volPercent + '%';
                document.getElementById('volFill').style.height = volPercent + '%';
                resetAutoHideTimer();
            });

            rightSide.addEventListener('touchend', () => {
                setTimeout(() => vOSD.classList.remove('active'), 600);
            });
        }

        async function fetchPlaylist() {
            try {
                const res = await fetch(playlistM3uUrl);
                const text = await res.text();
                parseM3u(text);
            } catch(e) { console.error(e); }
        }

        function parseM3u(text) {
            const lines = text.split('\n');
            let currentObj = {};
            for(let i=0; i<lines.length; i++) {
                let line = lines[i].trim();
                if(line.startsWith("#EXTINF:")) {
                    currentObj = {};
                    let nameMatch = line.match(/,(.+)$/);
                    if(nameMatch) currentObj.name = nameMatch[1].trim();
                    let logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    if(logoMatch) currentObj.logo = logoMatch[1];
                } else if(line.startsWith("http")) {
                    if(!currentObj.name) continue;
                    currentObj.url = line;
                    parsedChannels.push(currentObj);
                    currentObj = {};
                }
            }
            renderGrid(parsedChannels);
        }

        function renderGrid(list) {
            const grid = document.getElementById('uiChannelsGrid');
            grid.innerHTML = "";
            list.forEach(chan => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                let logoImg = chan.logo ? `<img src="${chan.logo}" onerror="this.src='https://via.placeholder.com/60?text=TV'">` : `<img src="https://via.placeholder.com/60?text=TV">`;
                card.innerHTML = `
                    <div class="logo-wrap">${logoImg}</div>
                    <div class="card-name">${chan.name}</div>
                `;
                card.onclick = () => launchPlayer(chan);
                grid.appendChild(card);
            });
        }

        function launchPlayer(channel) {
            activeSelectedChannel = channel;
            document.getElementById('playerContainer').style.display = 'block';
            document.getElementById('playerTitle').innerText = channel.name;
            document.getElementById('playerLogo').src = channel.logo || 'https://via.placeholder.com/30?text=TV';
            
            window.scrollTo({top: document.getElementById('playerContainer').offsetTop - 10, behavior: 'smooth'});
            loadStreamSource(channel.url);
            showControlPanel();
        }

        function loadStreamSource(url) {
            const qualSelect = document.getElementById('hlsQualitySelect');
            if(hlsInstance) hlsInstance.destroy();

            if(Hls.isSupported()) {
                hlsInstance = new Hls({ maxBufferLength: 30 });
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(videoElement);
                
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    if(hlsInstance.levels.length > 1) {
                        qualSelect.innerHTML = '<option value="-1">Auto (ডিফল্ট)</option>';
                        hlsInstance.levels.forEach((lvl, idx) => {
                            if(lvl.height) {
                                let label = lvl.height + 'p';
                                if(lvl.height === 1440) label = "1440p (2K)";
                                if(lvl.height === 2160) label = "2160p (4K)";
                                let opt = document.createElement('option');
                                opt.value = idx;
                                opt.textContent = label;
                                qualSelect.appendChild(opt);
                            }
                        });
                    }
                    videoElement.play().catch(e => console.log("Autoplay blocked"));
                    updatePlayButtonIcon(true);
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = url;
                videoElement.addEventListener('loadedmetadata', () => {
                    videoElement.play();
                    updatePlayButtonIcon(true);
                });
            }
        }

        function togglePlayPause() {
            if (videoElement.paused) {
                videoElement.play();
                updatePlayButtonIcon(true);
            } else {
                videoElement.pause();
                updatePlayButtonIcon(false);
            }
            resetAutoHideTimer();
        }

        function updatePlayButtonIcon(isPlaying) {
            const icon = document.querySelector('#customPlayBtn i');
            icon.className = isPlaying ? "fa-solid fa-pause" : "fa-solid fa-play";
        }

        function toggleSettingsOverlay() {
            const menu = document.getElementById('settingsMenu');
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
            resetAutoHideTimer();
        }

        function changeResolution(val) {
            if(!hlsInstance) return;
            let index = parseInt(val);
            if(index === -1) {
                hlsInstance.currentLevel = -1;
            } else if(hlsInstance.levels.length > index) {
                hlsInstance.currentLevel = index;
            }
            toggleSettingsOverlay();
        }

        function changeAspectRatio() {
            const wrap = document.getElementById('videoWrapper');
            const label = document.getElementById('ratioLabel');
            if(wrap.classList.contains('fit-mode')) {
                wrap.classList.remove('fit-mode');
                wrap.classList.add('stretch-mode');
                label.innerText = "Stretch";
            } else {
                wrap.classList.remove('stretch-mode');
                wrap.classList.add('fit-mode');
                label.innerText = "Fit";
            }
            toggleSettingsOverlay();
        }

        async function activatePiP() {
            try {
                if(document.pictureInPictureElement) await document.exitPictureInPicture();
                else await videoElement.requestPictureInPicture();
            } catch(e) { console.log(e); }
            toggleSettingsOverlay();
        }

        async function toggleFullscreen() {
            const container = document.getElementById('playerContainer');
            try {
                if (!document.fullscreenElement) {
                    if (container.requestFullscreen) await container.requestFullscreen();
                    else if (container.webkitRequestFullscreen) await container.webkitRequestFullscreen();
                    
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape').catch(e => console.log("Orientation lock restriction"));
                    }
                } else {
                    if (document.exitFullscreen) await document.exitFullscreen();
                    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
                }
            } catch (err) { console.error(err); }
            resetAutoHideTimer();
        }

        function switchServer(srvNum) {
            if(!activeSelectedChannel) return;
            document.querySelectorAll('.srv-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === (srvNum - 1));
            });
            let targetUrl = activeSelectedChannel.url;
            let sep = targetUrl.includes('?') ? '&' : '?';
            loadStreamSource(targetUrl + sep + "server=" + srvNum + "&ts=" + Date.now());
            resetAutoHideTimer();
        }

        function refreshStream() {
            if(activeSelectedChannel) loadStreamSource(activeSelectedChannel.url);
            resetAutoHideTimer();
        }

        function closePlayer() {
            if(hlsInstance) hlsInstance.destroy();
            document.getElementById('playerContainer').style.display = 'none';
            clearTimeout(controlsTimer);
        }

        document.getElementById('searchChan').addEventListener('input', (e) => {
            let term = e.target.value.toLowerCase();
            let filtered = parsedChannels.filter(c => c.name.toLowerCase().includes(term));
            renderGrid(filtered);
        });
    </script>
</body>
</html>
