<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sohel IPTV Pro</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #000000; 
            --panel-bg: #0d0d0d;
            --accent-magenta: #ff2a74; 
            --card-bg: #0c0c0e;
            --text-light: #ffffff;
            --overlay-bg: rgba(5, 5, 5, 0.98);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            padding-bottom: 30px;
            min-height: 100vh;
        }

        .player-container {
            max-width: 950px;
            margin: 10px auto;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 42, 116, 0.2);
            position: relative;
            display: none; 
            width: 95%;
            border: 1px solid rgba(255, 42, 116, 0.25);
        }

        .player-container:fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            margin: 0 !important;
            border-radius: 0 !important;
            border: none;
        }

        .main-screen {
            display: flex;
            width: 100%;
            aspect-ratio: 16 / 9;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .player-container:fullscreen .main-screen {
            height: 100vh !important;
            aspect-ratio: auto !important;
        }

        .video-render-box {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-render-box video {
            width: 100%;
            height: 100%;
            display: block;
        }

        .fit-mode video { object-fit: contain !important; }
        .stretch-mode video { object-fit: fill !important; width: 100vw !important; height: 100vh !important; }

        .premium-loader-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .spinner-ring {
            width: 45px;
            height: 45px;
            border: 3.5px solid rgba(255, 42, 116, 0.15);
            border-top-color: var(--accent-magenta);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 12px rgba(255, 42, 116, 0.2);
        }

        .loader-text {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: uppercase;
            opacity: 0.8;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .player-controls-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 15;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            transition: opacity 0.4s ease;
            opacity: 1;
        }

        .player-controls-layer.hidden {
            opacity: 0;
            cursor: none;
        }

        .player-top-bar, .player-bottom-bar {
            pointer-events: auto;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
            padding: 12px 15px;
        }
        
        .player-bottom-bar {
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .player-top-bar {
            display: grid;
            grid-template-columns: 1.3fr 1fr 1fr;
            align-items: center;
        }

        .top-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .back-btn { background: transparent; border: none; color: #fff; font-size: 18px; cursor: pointer; }
        .channel-logo-area { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .channel-logo-area img { width: 30px; height: 30px; border-radius: 50%; background: #fff; object-fit: contain; }
        .channel-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .server-container { display: flex; gap: 5px; justify-content: center; }
        .srv-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 4px 10px; border-radius: 15px; font-size: 10px; font-weight: 700; cursor: pointer; }
        .srv-btn.active { background: var(--accent-magenta); border-color: var(--accent-magenta); box-shadow: 0 0 10px rgba(255, 42, 116, 0.4); }

        .top-right { display: flex; align-items: center; gap: 14px; font-size: 16px; justify-content: flex-end; }
        .top-right i { cursor: pointer; padding: 4px; }

        .play-btn { background: transparent; border: none; color: #fff; font-size: 18px; cursor: pointer; }
        .progress-container { flex: 1; display: flex; align-items: center; }
        .live-badge { background: #ff0055; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; }

        .gesture-detector-box {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            display: flex;
        }
        .gesture-side { width: 50%; height: 100%; }

        .gesture-osd {
            position: absolute;
            top: 50%;
            transform: translateY(-50%) scale(0.85);
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            width: 45px;
            height: 160px;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            z-index: 25;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .gesture-osd.active { opacity: 1; transform: translateY(-50%) scale(1); }
        .osd-track { width: 5px; height: 90px; background: rgba(255,255,255,0.15); border-radius: 3px; position: relative; overflow: hidden; }
        .osd-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; border-radius: 3px; }
        #brightnessOSD .osd-fill { background: linear-gradient(to top, #ff9100, #ffea00); }
        #volumeOSD .osd-fill { background: linear-gradient(to top, #0072ff, #00c6ff); }
        .gesture-osd i { font-size: 14px; }
        .osd-val-text { font-size: 10px; font-weight: 700; }

        #brightnessOSD { left: 20px; }
        #volumeOSD { right: 20px; }

        .settings-overlay {
            position: absolute;
            top: 50px; right: 15px;
            width: 220px;
            background: var(--overlay-bg);
            border-radius: 12px;
            padding: 4px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 40;
            display: none; 
        }

        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; cursor: pointer; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .menu-item:last-child { border-bottom: none; }
        .menu-left { display: flex; align-items: center; gap: 10px; }
        .menu-left i { width: 16px; text-align: center; color: var(--accent-magenta); }
        .menu-right { color: #94a3b8; display: flex; align-items: center; gap: 5px; }
        .quality-select-inline { background: transparent; color: #fff; border: none; outline: none; font-size: 12px; font-weight: 600; cursor: pointer; }
        .quality-select-inline option { background: #000; }

        .landing-header {
            background: #000000;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center;
        }

        .landing-header h2 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--accent-magenta);
            text-shadow: 0 0 10px rgba(255, 42, 116, 0.3);
        }

        .search-box {
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
        }

        .search-box input {
            background: #0f0f12;
            border: 1px solid #1f1f24;
            padding: 12px 20px;
            border-radius: 25px;
            color: white;
            outline: none;
            width: 100%;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: var(--accent-magenta);
            box-shadow: 0 0 12px rgba(255, 42, 116, 0.25);
        }

        .grid-section {
            padding: 15px 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
        }
        
        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 15px;
            background: var(--accent-magenta);
            border-radius: 2px;
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
            gap: 12px; 
            width: 100%;
        }

        @media (min-width: 600px) { .channels-grid { grid-template-columns: repeat(4, 1fr) !important; gap: 14px; } }
        @media (min-width: 900px) { .channels-grid { grid-template-columns: repeat(6, 1fr) !important; gap: 16px; } }

        .channel-card {
            background: #000000;
            border: 2px solid var(--accent-magenta); 
            border-radius: 22px;
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(255, 42, 116, 0.05);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .channel-card:active {
            box-shadow: 0 0 15px rgba(255, 42, 116, 0.4);
            transform: scale(0.95);
        }

        .logo-wrap {
            width: 60px;
            height: 60px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        .logo-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .card-name {
            font-size: 10px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }

        @media (min-width: 600px) {
            .card-name { font-size: 12px; }
            .logo-wrap { width: 68px; height: 68px; }
        }

        .brightness-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0);
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="landing-header">
        <h2>Sohel IPTV Pro</h2>
        <div class="search-box">
            <input type="text" id="searchChan" placeholder="চ্যানেল খুঁজুন...">
        </div>
    </div>

    <div class="player-container" id="playerContainer">
        <div class="main-screen" id="mainScreenBox">
            <div class="brightness-overlay" id="brightLayer"></div>

            <div class="premium-loader-layer" id="streamLoader">
                <div class="spinner-ring"></div>
                <div class="loader-text">Loading Stream...</div>
            </div>

            <div class="gesture-detector-box" id="gestureBox">
                <div class="gesture-side" id="leftSideBright"></div>
                <div class="gesture-side" id="rightSideVol"></div>
            </div>

            <div class="gesture-osd" id="brightnessOSD">
                <span class="osd-val-text" id="brightText">100%</span>
                <div class="osd-track"><div class="osd-fill" id="brightFill"></div></div>
                <i class="fa-solid fa-sun"></i>
            </div>
          
            <div class="gesture-osd" id="volumeOSD">
                <span class="osd-val-text" id="volText">100%</span>
                <div class="osd-track"><div class="osd-fill" id="volFill"></div></div>
                <i class="fa-solid fa-volume-high"></i>
            </div>

            <div class="video-render-box fit-mode" id="videoWrapper">
                <video id="mainVideoPlayer" playsinline></video>
            </div>

            <div class="player-controls-layer" id="controlsLayer">
                <div class="player-top-bar">
                    <div class="top-left">
                        <button class="back-btn" onclick="closePlayer()"><i class="fa-solid fa-chevron-left"></i></button>
                        <div class="channel-logo-area">
                            <img id="playerLogo" src="" alt="">
                            <span class="channel-title" id="playerTitle">Loading...</span>
                        </div>
                    </div>
                    <div class="server-container">
                        <button class="srv-btn active" onclick="switchServer(1)">Server 1</button>
                        <button class="srv-btn" onclick="switchServer(2)">Server 2</button>
                        <button class="srv-btn" onclick="switchServer(3)">Server 3</button>
                    </div>
                    <div class="top-right">
                        <i class="fa-solid fa-rotate" onclick="refreshStream()"></i>
                        <i class="fa-solid fa-gear" onclick="toggleSettingsOverlay()"></i>
                        <i class="fa-solid fa-expand" onclick="toggleFullscreen()"></i>
                    </div>
                </div>

                <div class="player-bottom-bar">
                    <button class="play-btn" id="customPlayBtn" onclick="togglePlayPause()"><i class="fa-solid fa-pause"></i></button>
                    <div class="progress-container">
                        <span class="live-badge">● LIVE</span>
                    </div>
                </div>
            </div>

            <div class="settings-overlay" id="settingsMenu">
                <div class="menu-item">
                    <div class="menu-left"><i class="fa-solid fa-sliders"></i><span>Quality</span></div>
                    <div class="menu-right">
                        <select id="hlsQualitySelect" class="quality-select-inline" onchange="changeResolution(this.value)">
                            <option value="-1">Auto (ডিফল্ট)</option>
                        </select>
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                </div>
                <div class="menu-item" onclick="changeAspectRatio()">
                    <div class="menu-left"><i class="fa-solid fa-vector-square"></i><span>Aspect Ratio</span></div>
                    <div class="menu-right"><span id="ratioLabel">Fit</span></div>
                </div>
                <div class="menu-item" onclick="activatePiP()">
                    <div class="menu-left"><i class="fa-solid fa-window-restore"></i><span>PiP</span></div>
                    <div class="menu-right"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="grid-section" id="listSection">
        <h3 class="section-title">সব চ্যানেলসমূহ</h3>
        <div class="channels-grid" id="uiChannelsGrid"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        playlistM3uUrl = "https://raw.githubusercontent.com/sohel970/my-live-tv/refs/heads/main/Skym3u-176.m3u?v=" + Date.now();
        
        let parsedChannels = [];
        let activeSelectedChannel = null;
        let hlsInstance = null;
        const videoElement = document.getElementById('mainVideoPlayer');
        const loaderLayer = document.getElementById('streamLoader');
        let controlsTimer = null;
        let isPanelActive = true;

        let startY = 0;
        let startVol = 1;
        let startBright = 100;
        let currentBrightness = 100;

        document.addEventListener('DOMContentLoaded', () => {
            fetchPlaylist();
            setupGestureListeners();
            setupPanelAutoHideTrigger();
            
            videoElement.addEventListener('playing', () => { loaderLayer.style.display = 'none'; });
            videoElement.addEventListener('waiting', () => { loaderLayer.style.display = 'flex'; });
        });

        function setupPanelAutoHideTrigger() {
            document.getElementById('gestureBox').addEventListener('click', () => {
                if (!isPanelActive) showControlPanel();
                else hideControlPanel();
            });
            document.getElementById('playerContainer').addEventListener('touchstart', resetAutoHideTimer);
            document.getElementById('playerContainer').addEventListener('mousemove', resetAutoHideTimer);
            showControlPanel();
        }

        function showControlPanel() {
            document.getElementById('controlsLayer').classList.remove('hidden');
            isPanelActive = true;
            resetAutoHideTimer();
        }

        function hideControlPanel() {
            document.getElementById('controlsLayer').classList.add('hidden');
            document.getElementById('settingsMenu').style.display = 'none';
            isPanelActive = false;
        }

        function resetAutoHideTimer() {
            clearTimeout(controlsTimer);
            if (isPanelActive) {
                controlsTimer = setTimeout(() => { hideControlPanel(); }, 7000);
            }
        }

        function setupGestureListeners() {
            const leftSide = document.getElementById('leftSideBright');
            const rightSide = document.getElementById('rightSideVol');
            const bOSD = document.getElementById('brightnessOSD');
            const vOSD = document.getElementById('volumeOSD');

            leftSide.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                startBright = currentBrightness;
                bOSD.classList.add('active');
            });

            leftSide.addEventListener('touchmove', (e) => {
                e.preventDefault();
                let deltaY = startY - e.touches[0].clientY;
                let change = Math.round((deltaY / window.innerHeight) * 220);
                let newBright = Math.min(100, Math.max(10, startBright + change));
                
                currentBrightness = newBright;
                let alpha = (100 - newBright) / 100;
                document.getElementById('brightLayer').style.background = `rgba(0, 0, 0, ${alpha * 0.95})`; 
                
                document.getElementById('brightText').innerText = newBright + '%';
                document.getElementById('brightFill').style.height = newBright + '%';
                resetAutoHideTimer();
            });

            leftSide.addEventListener('touchend', () => { setTimeout(() => bOSD.classList.remove('active'), 500); });

            rightSide.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                startVol = videoElement.volume;
                vOSD.classList.add('active');
            });

            rightSide.addEventListener('touchmove', (e) => {
                e.preventDefault();
                let deltaY = startY - e.touches[0].clientY;
                let change = deltaY / window.innerHeight * 1.8;
                let newVol = Math.min(1, Math.max(0, startVol + change));
                
                videoElement.volume = newVol;
                let volPercent = Math.round(newVol * 100);
                
                const volIcon = document.querySelector('#volumeOSD i');
                if(volPercent === 0) volIcon.className = "fa-solid fa-volume-xmark";
                else if(volPercent < 50) volIcon.className = "fa-solid fa-volume-low";
                else volIcon.className = "fa-solid fa-volume-high";

                document.getElementById('volText').innerText = volPercent + '%';
                document.getElementById('volFill').style.height = volPercent + '%';
                resetAutoHideTimer();
            });

            rightSide.addEventListener('touchend', () => { setTimeout(() => vOSD.classList.remove('active'), 500); });
        }

        async function fetchPlaylist() {
            try {
                const res = await fetch(playlistM3uUrl);
                const text = await res.text();
                parseM3u(text);
            } catch(e) { console.error("ফাইল লোড করতে সমস্যা:", e); }
        }

        function parseM3u(text) {
            const lines = text.split('\n');
            let currentObj = {};
            parsedChannels = []; 

            for(let i=0; i<lines.length; i++) {
                let line = lines[i].trim();
                if(!line) continue;

                if(line.startsWith("#EXTINF:")) {
                    currentObj = {};
                    
                    let nameMatch = line.match(/,\s*(.+)$/);
                    if(nameMatch) {
                        let rawName = nameMatch[1].trim().replace(/\r/g, "");
                        currentObj.name = rawName;
                        
                        // 🚀 অটোমেটিক লোগো জেনারেটর (নাম থেকে ফালতু স্পেস/লেখা বাদ দিয়ে আইডি তৈরি)
                        let logoId = rawName.toLowerCase()
                                            .replace(/\s+/g, '')
                                            .replace(/hd|sd|tv|bd|sports|movies|bangla/g, '');
                        currentObj.autoLogo = `https://iptv-org.github.io/logos/channels/${logoId}.png`;
                    }
                    
                    let logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    if(logoMatch) currentObj.logo = logoMatch[1];
                } else if(line.startsWith("http")) {
                    if(!currentObj.name) continue;
                    currentObj.url = line.replace(/\r/g, ""); 
                    parsedChannels.push(currentObj);
                    currentObj = {};
                }
            }
            renderGrid(parsedChannels);
        }

        function renderGrid(list) {
            const grid = document.getElementById('uiChannelsGrid');
            grid.innerHTML = "";
            if(list.length === 0) {
                grid.innerHTML = "<p style='color:#ccc; text-align:center; grid-column: 1/-1; padding:20px;'>কোনো চ্যানেল খুঁজে পাওয়া যায়নি!</p>";
                return;
            }
            list.forEach(chan => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                
                // ১. যদি .m3u ফাইলে অলরেডি থাকে তবে সেটা, না হলে আমাদের জেনারেট করা অটো-লিংক নিবে
                let logoUrl = chan.logo || chan.autoLogo;
                
                // ২. লোগো ইমেজ বা অল্টারনেটিভ প্রফেশনাল গ্লোয়িং টিভি আইকন মেকানিজম
                let logoImg = `<img src="${logoUrl}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                               <i class="fa-solid fa-tv" style="display:none; font-size: 24px; color: #ff2a74;"></i>`;
                
                card.innerHTML = `
                    <div class="logo-wrap" style="display:flex; align-items:center; justify-content:center;">${logoImg}</div>
                    <div class="card-name">${chan.name}</div>
                `;
                card.onclick = () => launchPlayer(chan);
                grid.appendChild(card);
            });
        }

        function launchPlayer(channel) {
            activeSelectedChannel = channel;
            loaderLayer.style.display = 'flex';
            
            document.getElementById('playerContainer').style.display = 'block';
            document.getElementById('playerTitle').innerText = channel.name;
            
            // প্লেয়ারের ভেতরের টপ লোগো সেট করার কন্ডিশন
            let logoUrl = channel.logo || channel.autoLogo;
            const pLogo = document.getElementById('playerLogo');
            pLogo.src = logoUrl;
            pLogo.onerror = () => { pLogo.src = 'https://via.placeholder.com/30?text=TV'; };
            
            window.scrollTo({top: document.getElementById('playerContainer').offsetTop - 10, behavior: 'smooth'});
            loadStreamSource(channel.url);
            showControlPanel();
        }

        function loadStreamSource(url) {
            const qualSelect = document.getElementById('hlsQualitySelect');
            if(hlsInstance) hlsInstance.destroy();

            if(Hls.isSupported()) {
                hlsInstance = new Hls({ maxBufferLength: 30 });
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(videoElement);
                
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    if(hlsInstance.levels.length > 1) {
                        qualSelect.innerHTML = '<option value="-1">Auto (ডিফল্ট)</option>';
                        hlsInstance.levels.forEach((lvl, idx) => {
                            if(lvl.height) {
                                let label = lvl.height + 'p';
                                let opt = document.createElement('option');
                                opt.value = idx;
                                opt.textContent = label;
                                qualSelect.appendChild(opt);
                            }
                        });
                    }
                    videoElement.play().catch(e => console.log("Play block catch"));
                    updatePlayButtonIcon(true);
                });
                
                hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) { loaderLayer.style.display = 'flex'; }
                });
                
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = url;
                videoElement.addEventListener('loadedmetadata', () => {
                    videoElement.play();
                    updatePlayButtonIcon(true);
                });
            }
        }

        function togglePlayPause() {
            if (videoElement.paused) {
                videoElement.play();
                updatePlayButtonIcon(true);
            } else {
                videoElement.pause();
                updatePlayButtonIcon(false);
            }
            resetAutoHideTimer();
        }

        function updatePlayButtonIcon(isPlaying) {
            const icon = document.querySelector('#customPlayBtn i');
            icon.className = isPlaying ? "fa-solid fa-pause" : "fa-solid fa-play";
        }

        function toggleSettingsOverlay() {
            const menu = document.getElementById('settingsMenu');
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
            resetAutoHideTimer();
        }

        function changeResolution(val) {
            if(!hlsInstance) return;
            let index = parseInt(val);
            if(index === -1) hlsInstance.currentLevel = -1;
            else if(hlsInstance.levels.length > index) hlsInstance.currentLevel = index;
            toggleSettingsOverlay();
        }

        function changeAspectRatio() {
            const wrap = document.getElementById('videoWrapper');
            const label = document.getElementById('ratioLabel');
            if(wrap.classList.contains('fit-mode')) {
                wrap.classList.remove('fit-mode');
                wrap.classList.add('stretch-mode');
                label.innerText = "Stretch";
            } else {
                wrap.classList.remove('stretch-mode');
                wrap.classList.add('fit-mode');
                label.innerText = "Fit";
            }
            toggleSettingsOverlay();
        }

        async function activatePiP() {
            try {
                if(document.pictureInPictureElement) await document.exitPictureInPicture();
                else await videoElement.requestPictureInPicture();
            } catch(e) { console.log(e); }
            toggleSettingsOverlay();
        }

        async function toggleFullscreen() {
            const container = document.getElementById('playerContainer');
            try {
                if (!document.fullscreenElement) {
                    if (container.requestFullscreen) await container.requestFullscreen();
                    else if (container.webkitRequestFullscreen) await container.webkitRequestFullscreen();
                    
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape').catch(e => console.log("Orientation error"));
                    }
                } else {
                    if (document.exitFullscreen) await document.exitFullscreen();
                    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
                }
            } catch (err) { console.error(err); }
            resetAutoHideTimer();
        }

        function switchServer(srvNum) {
            if(!activeSelectedChannel) return;
            loaderLayer.style.display = 'flex'; 
            document.querySelectorAll('.srv-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === (srvNum - 1));
            });
            let targetUrl = activeSelectedChannel.url;
            let sep = targetUrl.includes('?') ? '&' : '?';
            loadStreamSource(targetUrl + sep + "server=" + srvNum + "&ts=" + Date.now());
            resetAutoHideTimer();
        }

        function refreshStream() {
            if(activeSelectedChannel) {
                loaderLayer.style.display = 'flex';
                loadStreamSource(activeSelectedChannel.url);
            }
            resetAutoHideTimer();
        }

        function closePlayer() {
            if(hlsInstance) hlsInstance.destroy();
            document.getElementById('playerContainer').style.display = 'none';
            loaderLayer.style.display = 'none';
            clearTimeout(controlsTimer);
        }

        document.getElementById('searchChan').addEventListener('input', (e) => {
            let term = e.target.value.toLowerCase();
            let filtered = parsedChannels.filter(c => c.name.toLowerCase().includes(term));
            renderGrid(filtered);
        });
    </script>
</body>
</html>
