<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sohel IPTV Pro</title>
    
    <!-- Plyr Player CSS & Fonts -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #06090e;
            --panel-bg: #0d1117;
            --accent-magenta: #e91e63;
            --text-light: #ffffff;
            --overlay-bg: rgba(13, 17, 23, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* -----------------------------------------
           PREMIUM VIDEO PLAYER WRAPPER (FIXED)
        -------------------------------------------- */
        .player-container {
            max-width: 950px;
            margin: 10px auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
            display: none; 
            width: 96%;
        }

        /* 🚀 ফুলস্ক্রিন ল্যান্ডস্কেপে কেটে যাওয়া প্রতিরোধের ফিক্স */
        .player-container:fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            margin: 0 !important;
            border-radius: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            background: #000 !important;
        }

        /* Top Header Navigation (🚀 আইকন হারিয়ে যাওয়া ফিক্স) */
        .player-top-bar {
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 25;
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr; /* তিনটি অংশকে ফিক্সড জায়গা দেওয়া হলো */
            align-items: center;
            padding: 10px 15px;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0; /* টেক্সট ট্রাঙ্কেশন সচল করতে */
        }

        .back-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .channel-logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            width: 100%;
        }

        .channel-logo-area img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #fff;
            object-fit: contain;
            flex-shrink: 0;
        }

        /* 🚀 নাম যত বড়ই হোক, আইকনকে ধাক্কা দেবে না */
        .channel-title {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            color: #fff;
        }

        .server-container {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-shrink: 0;
        }

        .srv-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .srv-btn.active {
            background: var(--accent-magenta);
            border-color: var(--accent-magenta);
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 16px;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        .top-right i {
            cursor: pointer;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            padding: 4px;
        }

        /* Video Box Screen layout */
        .main-screen {
            display: flex;
            width: 100%;
            aspect-ratio: 16 / 9;
            position: relative;
            background: #000;
        }

        .player-container:fullscreen .main-screen {
            flex: 1 !important;
            height: 100% !important;
            aspect-ratio: auto !important; /* ফুলস্ক্রিনে বাউণ্ডারি রিমুভ */
        }

        .video-render-box {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 🚀 Aspect Ratio ফিক্সড করার স্ট্যান্ডার্ড মেথড */
        .video-render-box video {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
        }

        .fit-mode video { object-fit: contain !important; }
        .stretch-mode video { object-fit: fill !important; }

        /* Plyr এর ডিফল্ট অবজেক্ট ফিট ওভাররাইড */
        .fit-mode .plyr__video-wrapper video { object-fit: contain !important; }
        .stretch-mode .plyr__video-wrapper video { object-fit: fill !important; }

        /* -----------------------------------------
           SETTINGS OVERLAY PANEL (⚙️ Menu)
        -------------------------------------------- */
        .settings-overlay {
            position: absolute;
            top: 45px;
            right: 15px;
            width: 230px;
            background: var(--overlay-bg);
            border-radius: 10px;
            padding: 4px 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 40;
            display: none; 
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .menu-item:last-child { border-bottom: none; }
        .menu-left { display: flex; align-items: center; gap: 10px; color: #e2e8f0; }
        .menu-left i { width: 16px; text-align: center; }
        .menu-right { color: #94a3b8; display: flex; align-items: center; gap: 5px; }

        .quality-select-inline {
            background: transparent;
            color: #fff;
            border: none;
            outline: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: right;
        }
        .quality-select-inline option { background: #151b26; }

        /* Floating Grip Button */
        .floating-grid-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: var(--accent-magenta);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(233, 30, 99, 0.4);
            border: none;
            z-index: 999;
        }

        /* Landing Channel Grid UI */
        .landing-header {
            background: var(--panel-bg);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 2px solid var(--accent-magenta);
        }

        .search-box input {
            background: #1c2331;
            border: 1px solid #2e3b52;
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            outline: none;
            width: 100%;
            font-size: 14px;
        }

        .grid-section { padding: 15px; max-width: 950px; margin: 0 auto; }
        .section-title { font-size: 16px; margin-bottom: 15px; border-left: 4px solid var(--accent-magenta); padding-left: 8px; }
        .channels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
        
        .channel-card {
            background: var(--panel-bg);
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
        }

        .logo-wrap {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .logo-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .card-name { font-size: 11px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Plyr Fixes */
        .plyr { height: 100% !important; width: 100% !important; }
        .plyr__video-wrapper { height: 100% !important; width: 100% !important; }
    </style>
</head>
<body>

    <!-- App Top Bar Header -->
    <div class="landing-header">
        <h2>Sohel IPTV Pro</h2>
        <div class="search-box">
            <input type="text" id="searchChan" placeholder="চ্যানেল খুঁজুন...">
        </div>
    </div>

    <!-- Floating Grid Menu Button -->
    <button class="floating-grid-btn" onclick="scrollToGrid()">
        <i class="fa-solid fa-grip"></i>
    </button>

    <!-- Core Main Player Window -->
    <div class="player-container" id="playerContainer">
        
        <!-- Top Overlay Navbar Controls -->
        <div class="player-top-bar">
            <div class="top-left">
                <button class="back-btn" onclick="closePlayer()"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="channel-logo-area">
                    <img id="playerLogo" src="" alt="">
                    <span class="channel-title" id="playerTitle">Loading...</span>
                </div>
            </div>
            
            <div class="server-container">
                <button class="srv-btn active" onclick="switchServer(1)">Server 1</button>
                <button class="srv-btn" onclick="switchServer(2)">Server 2</button>
                <button class="srv-btn" onclick="switchServer(3)">Server 3</button>
            </div>

            <div class="top-right">
                <i class="fa-solid fa-rotate" onclick="refreshStream()"></i>
                <i class="fa-solid fa-gear" onclick="toggleSettingsOverlay()"></i>
                <i class="fa-solid fa-expand" onclick="toggleFullscreen()"></i>
            </div>
        </div>

        <!-- Video Rendering Content Area -->
        <div class="main-screen">
            <div class="video-render-box fit-mode" id="videoWrapper">
                <video id="mainVideoPlayer" playsinline></video>
            </div>
        </div>

        <!-- Settings Modal (⚙️ Gear List Options) -->
        <div class="settings-overlay" id="settingsMenu">
            <!-- Quality Area -->
            <div class="menu-item">
                <div class="menu-left">
                    <i class="fa-solid fa-sliders"></i>
                    <span>Quality</span>
                </div>
                <div class="menu-right">
                    <select id="hlsQualitySelect" class="quality-select-inline" onchange="changeResolution(this.value)">
                        <option value="-1">Auto (ডিফল্ট)</option>
                        <option value="1080">1080p (HD)</option>
                        <option value="1440">1440p (2K)</option>
                        <option value="2160">2160p (4K)</option>
                    </select>
                    <i class="fa-solid fa-chevron-right"></i>
                </div>
            </div>
            <!-- Aspect Ratio Controller -->
            <div class="menu-item" onclick="changeAspectRatio()">
                <div class="menu-left">
                    <i class="fa-solid fa-vector-square"></i>
                    <span>Aspect Ratio</span>
                </div>
                <div class="menu-right">
                    <span id="ratioLabel">Fit</span>
                </div>
            </div>
            <!-- Picture In Picture Mode -->
            <div class="menu-item" onclick="activatePiP()">
                <div class="menu-left">
                    <i class="fa-solid fa-window-restore"></i>
                    <span>PiP</span>
                </div>
                <div class="menu-right"></div>
            </div>
        </div>
    </div>

    <!-- Channels Render Container Section -->
    <div class="grid-section" id="listSection">
        <h3 class="section-title">সব চ্যানেলসমূহ</h3>
        <div class="channels-grid" id="uiChannelsGrid"></div>
    </div>

    <!-- Core Script Assets Integration Modules -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <script>
        const playlistM3uUrl = "https://raw.githubusercontent.com/imShakil/tvlink/refs/heads/main/iptv.m3u8";
        let parsedChannels = [];
        let activeSelectedChannel = null;
        let plyrEngine = null;
        let hlsInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            plyrEngine = new Plyr('#mainVideoPlayer', {
                controls: ['play', 'progress', 'current-time', 'mute', 'volume']
            });
            fetchPlaylist();
        });

        async function fetchPlaylist() {
            try {
                const res = await fetch(playlistM3uUrl);
                const text = await res.text();
                parseM3u(text);
            } catch(e) { console.error(e); }
        }

        function parseM3u(text) {
            const lines = text.split('\n');
            let currentObj = {};
            for(let i=0; i<lines.length; i++) {
                let line = lines[i].trim();
                if(line.startsWith("#EXTINF:")) {
                    currentObj = {};
                    let nameMatch = line.match(/,(.+)$/);
                    if(nameMatch) currentObj.name = nameMatch[1].trim();
                    let logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    if(logoMatch) currentObj.logo = logoMatch[1];
                } else if(line.startsWith("http")) {
                    if(!currentObj.name) continue;
                    currentObj.url = line;
                    parsedChannels.push(currentObj);
                    currentObj = {};
                }
            }
            renderGrid(parsedChannels);
        }

        function renderGrid(list) {
            const grid = document.getElementById('uiChannelsGrid');
            grid.innerHTML = "";
            list.forEach(chan => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                let logoImg = chan.logo ? `<img src="${chan.logo}" onerror="this.src='https://via.placeholder.com/50?text=TV'">` : `<img src="https://via.placeholder.com/50?text=TV">`;
                card.innerHTML = `
                    <div class="logo-wrap">${logoImg}</div>
                    <div class="card-name">${chan.name}</div>
                `;
                card.onclick = () => launchPlayer(chan);
                grid.appendChild(card);
            });
        }

        function launchPlayer(channel) {
            activeSelectedChannel = channel;
            document.getElementById('playerContainer').style.display = 'block';
            document.getElementById('playerTitle').innerText = channel.name;
            document.getElementById('playerLogo').src = channel.logo || 'https://via.placeholder.com/30?text=TV';
            
            window.scrollTo({top: document.getElementById('playerContainer').offsetTop - 10, behavior: 'smooth'});
            loadStreamSource(channel.url);
        }

        function loadStreamSource(url) {
            const videoElement = document.getElementById('mainVideoPlayer');
            const qualSelect = document.getElementById('hlsQualitySelect');

            if(hlsInstance) hlsInstance.destroy();

            if(Hls.isSupported()) {
                hlsInstance = new Hls({ maxBufferLength: 30 });
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(videoElement);
                
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    if(hlsInstance.levels.length > 1) {
                        qualSelect.innerHTML = '<option value="-1">Auto (ডিফল্ট)</option>';
                        hlsInstance.levels.forEach((lvl, idx) => {
                            if(lvl.height) {
                                let label = lvl.height + 'p';
                                if(lvl.height === 1440) label = "1440p (2K)";
                                if(lvl.height === 2160) label = "2160p (4K)";
                                let opt = document.createElement('option');
                                opt.value = idx;
                                opt.textContent = label;
                                qualSelect.appendChild(opt);
                            }
                        });
                    }
                    videoElement.play().catch(e => console.log("Autoplay issue"));
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = url;
                videoElement.addEventListener('loadedmetadata', () => videoElement.play());
            }
        }

        function toggleSettingsOverlay() {
            const menu = document.getElementById('settingsMenu');
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        }

        function changeResolution(val) {
            if(!hlsInstance) return;
            let index = parseInt(val);
            if(index === -1) {
                hlsInstance.currentLevel = -1;
            } else if(hlsInstance.levels.length > index) {
                hlsInstance.currentLevel = index;
            }
            toggleSettingsOverlay();
        }

        // 🚀 Aspect Ratio ফিক্স লজিক (যা Plyr ক্লাসের ভেতরেও কাজ করবে)
        function changeAspectRatio() {
            const wrap = document.getElementById('videoWrapper');
            const label = document.getElementById('ratioLabel');
            if(wrap.classList.contains('fit-mode')) {
                wrap.classList.remove('fit-mode');
                wrap.classList.add('stretch-mode');
                label.innerText = "Stretch";
            } else {
                wrap.classList.remove('stretch-mode');
                wrap.classList.add('fit-mode');
                label.innerText = "Fit";
            }
            toggleSettingsOverlay();
        }

        async function activatePiP() {
            const video = document.getElementById('mainVideoPlayer');
            try {
                if(document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    await video.requestPictureInPicture();
                }
            } catch(e) { console.log(e); }
            toggleSettingsOverlay();
        }

        // 🚀 ফুলস্ক্রিন ও ওরিয়েন্টেশন ফিক্স মেকানিজম
        async function toggleFullscreen() {
            const container = document.getElementById('playerContainer');
            try {
                if (!document.fullscreenElement) {
                    if (container.requestFullscreen) {
                        await container.requestFullscreen();
                    } else if (container.webkitRequestFullscreen) {
                        await container.webkitRequestFullscreen();
                    }
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape').catch(e => console.log("Orientation lock restricted"));
                    }
                } else {
                    if (document.exitFullscreen) {
                        await document.exitFullscreen();
                    }
                    if (screen.orientation && screen.orientation.unlock) {
                        screen.orientation.unlock();
                    }
                }
            } catch (err) {
                console.error(err);
            }
        }

        function switchServer(srvNum) {
            if(!activeSelectedChannel) return;
            document.querySelectorAll('.srv-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === (srvNum - 1));
            });
            let targetUrl = activeSelectedChannel.url;
            let sep = targetUrl.includes('?') ? '&' : '?';
            loadStreamSource(targetUrl + sep + "server=" + srvNum + "&ts=" + Date.now());
        }

        function refreshStream() {
            if(activeSelectedChannel) loadStreamSource(activeSelectedChannel.url);
        }

        function closePlayer() {
            if(hlsInstance) hlsInstance.destroy();
            document.getElementById('playerContainer').style.display = 'none';
        }

        function scrollToGrid() {
            document.getElementById('listSection').scrollIntoView({behavior: 'smooth'});
        }

        document.getElementById('searchChan').addEventListener('input', (e) => {
            let term = e.target.value.toLowerCase();
            let filtered = parsedChannels.filter(c => c.name.toLowerCase().includes(term));
            renderGrid(filtered);
        });
    </script>
</body>
</html>
